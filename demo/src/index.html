<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Diff Demo</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--card:#f6f8fa;--accent:#0969da;--moved:#0969da;--edited:#8250df;--fmt:#6e7781}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--card:#161b22;--accent:#4493f8;--moved:#4493f8;--edited:#ab7df8;--fmt:#8d96a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
header .actions{display:flex;gap:8px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
#scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .tk{font-size:12px;color:var(--muted)} .tile .v{font-size:20px;font-weight:650;margin-top:2px} .tile .d{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:0;height:calc(100% - 160px)}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px}
#filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border-radius:999px;padding:2px 10px;font-size:12px} .chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 4px 6px}
.item{display:block;width:100%;text-align:left;margin:0 0 4px;padding:6px 8px;border-color:transparent;background:transparent}
.item:hover{background:var(--card)} .item.on{background:var(--card);border-color:var(--line)}
.item .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ks{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.k-moved,.k-movedWithEdit,.k-reordered,.k-extractedFunction,.k-inlinedFunction{color:var(--moved);border-color:var(--moved)}
.k-renamed{color:var(--edited);border-color:var(--edited)} .k-reformatted{color:var(--fmt)}
main{overflow:auto;min-width:0}
.casehead{padding:10px 16px;border-bottom:1px solid var(--line)} .casehead h2{font-size:15px;margin:0} #case-meta{color:var(--muted);font-size:12px}
#diff{padding:8px 0}
@media (max-width:860px){#scores{grid-template-columns:repeat(2,1fr)} .layout{grid-template-columns:1fr;height:auto} aside{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}
</style>
</head>
<body>
<header><h1>Semantic diff engine</h1><div class="actions"><button id="icons"></button><button id="theme"></button></div></header>
<section id="scores"></section>
<div class="layout">
  <aside><div id="filters"></div><div id="list"></div></aside>
  <main><div class="casehead"><h2 id="case-title"></h2><div id="case-meta"></div></div><div id="diff"></div></main>
</div>
<script type="module" src="./page.js"></script>
</body>
</html>
