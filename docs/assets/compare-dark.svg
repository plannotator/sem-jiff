  <text class="tick" x="200" y="523" text-anchor="middle">0%</text>
  <line x1="292.5" y1="276" x2="292.5" y2="508" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="292.5" y="523" text-anchor="middle">25%</text>
  <line x1="385" y1="276" x2="385" y2="508" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="385" y="523" text-anchor="middle">50%</text>
  <line x1="477.5" y1="276" x2="477.5" y2="508" stroke="#2c2c2a" stroke-width="1"/>
