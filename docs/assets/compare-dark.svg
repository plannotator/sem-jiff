  <text class="label" x="16" y="345">difftastic</text>
  <path d="M200 330h265.6a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-265.6z" fill="#6b6a65"/>
  <text class="value" x="477.6" y="345">51 of 70 (73%)</text>
  <text class="label" x="16" y="375">sem 0.8.0</text>
  <path d="M200 360h86.2a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-86.2z" fill="#6b6a65"/>
  <text class="value" x="298.2" y="375">40 of 164 audited (24%)</text>
