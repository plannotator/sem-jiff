<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534" role="img" aria-labelledby="t d">
  <title id="t">How sem-jiff compares</title>
  <desc id="d">Extract and inline on real Java commits (122 real cases in Guava, Kafka, Spring Boot and Netty): RefactoringMiner 96 found (79%), 19 wrong; sem-jiff 74 found (61%), 1 wrong. Wrong claims on held-out Kotlin commits (ktor, Exposed): sem-jiff 0 of 46, difftastic 51 of 70, sem 0.8.0 40 of 164 audited. Swift (swift-nio, swift-composable-architecture): sem-jiff 0 of 158, difftastic 13 of 88 audited, sem 0.8.0 4 of 95 audited.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f0efec; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: #c3c2b7; }
    .label { font-size: 14px; }
    .label-strong { font-size: 14px; font-weight: 600; }
    .group { font-size: 13px; font-weight: 600; fill: #c3c2b7; }
    .value, .value-strong { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
    .value { font-size: 13px; font-variant-numeric: tabular-nums; }
    .value-strong { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .head { font-size: 12px; fill: #898781; }
    .tick { font-size: 11px; fill: #898781; font-variant-numeric: tabular-nums; }
  </style>
  <text class="title" x="0" y="22">Extract and inline on real Java commits</text>
  <text class="sub" x="0" y="43">122 real cases in Guava, Kafka, Spring Boot and Netty</text>
  <text class="head" x="200" y="76">Found, of 122</text>
  <text class="head" x="800" y="76" text-anchor="end">Wrong claims</text>
  <line x1="200" y1="86" x2="200" y2="150" stroke="#383835" stroke-width="1"/>
  <text class="tick" x="200" y="165" text-anchor="middle">0%</text>
  <line x1="292.5" y1="86" x2="292.5" y2="150" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="292.5" y="165" text-anchor="middle">25%</text>
  <line x1="385" y1="86" x2="385" y2="150" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="385" y="165" text-anchor="middle">50%</text>
  <line x1="477.5" y1="86" x2="477.5" y2="150" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="477.5" y="165" text-anchor="middle">75%</text>
  <line x1="570" y1="86" x2="570" y2="150" stroke="#2c2c2a" stroke-width="1"/>
  <text class="tick" x="570" y="165" text-anchor="middle">100%</text>
  <text class="label" x="0" y="107">RefactoringMiner</text>
  <path d="M200 92h287.1a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-287.1z" fill="#6b6a65"/>
  <text class="value" x="499.1" y="107">96 (79%)</text>
  <text class="value" x="800" y="107" text-anchor="end">19 wrong</text>
  <text class="label-strong" x="0" y="141">sem-jiff</text>
  <path d="M200 126h220.4a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-220.4z" fill="#3987e5"/>
  <text class="value-strong" x="432.4" y="141">74 (61%)</text>
  <text class="value-strong" x="800" y="141" text-anchor="end">1 wrong</text>
  <text class="title" x="0" y="212">Wrong claims on held-out commits: moves, renames, formatting</text>
  <text class="sub" x="0" y="233">Kotlin: ktor, Exposed. Swift: swift-nio, swift-composable-architecture.</text>
