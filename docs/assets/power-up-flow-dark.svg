<svg xmlns="http://www.w3.org/2000/svg" width="800" height="42" viewBox="0 0 800 42" role="img" aria-labelledby="t d">
  <title id="t">How the second opinion is asked</title>
  <desc id="d">Engine rules, then the unsure candidates go to Jev, and Clef breaks ties when Jev is unsure.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f0efec; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: #c3c2b7; }
    .label { font-size: 14px; }
    .label-strong { font-size: 14px; font-weight: 600; }
    .group { font-size: 13px; font-weight: 600; fill: #c3c2b7; }
    .value, .value-strong { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
    .value { font-size: 13px; font-variant-numeric: tabular-nums; }
    .value-strong { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .head { font-size: 12px; fill: #898781; }
    .tick { font-size: 11px; fill: #898781; font-variant-numeric: tabular-nums; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#898781"/></marker></defs>
  <rect x="1.0" y="1" width="164" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
  <text class="label" x="83.0" y="26" text-anchor="middle">Engine rules</text>
  <line x1="171.0" y1="21" x2="206.3" y2="21" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="212.3" y="1" width="164" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
  <text class="label" x="294.3" y="26" text-anchor="middle">Unsure candidates</text>
  <line x1="382.3" y1="21" x2="417.7" y2="21" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="423.7" y="1" width="164" height="40" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
  <text class="label-strong" x="505.7" y="26" text-anchor="middle">Jev decides</text>
  <line x1="593.7" y1="21" x2="629.0" y2="21" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="635.0" y="1" width="164" height="40" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
  <text class="label-strong" x="717.0" y="26" text-anchor="middle">Clef breaks ties</text>

</svg>
